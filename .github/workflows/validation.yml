name: R validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tidyr
            any::lubridate
            any::zoo
            any::xgboost
            any::forecast
            any::tibble
            any::testthat
            any::DBI
            any::RMariaDB

      - name: Parse all R files
        shell: Rscript {0}
        run: |
          files <- list.files(
            c("R", "scripts", "tests"),
            pattern = "[.]R$",
            recursive = TRUE,
            full.names = TRUE
          )
          invisible(lapply(files, parse))

      - name: Run tests
        run: Rscript tests/testthat.R
